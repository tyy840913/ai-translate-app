name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK 工具
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: 安装 SDK 平台与构建工具
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: 编译 APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 查看产物
        run: ls -lh app/build/outputs/apk/release/

      - name: 上传 APK
        uses: actions/upload-artifact@v6
        with:
          name: AI-Translate-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: 构建成功后自动发布
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[0-9.]+' app/build.gradle.kts)
          TAG="v$VERSION"
          echo "version=$VERSION tag=$TAG"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "release $TAG 已存在，跳过自动发布"
            exit 0
          fi
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "AI Translate $TAG" \
            --notes "自动构建" \
            --target "${{ github.sha }}"
          gh release upload "$TAG" \
            app/build/outputs/apk/release/app-release.apk \
            --repo "${{ github.repository }}"
          gh release view "$TAG" --repo "${{ github.repository }}"
