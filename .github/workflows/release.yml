name: Release APK

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "要发布的 tag（如 v1.3.22）"
        required: true
        default: "v1.3.35"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK 工具
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: 安装 SDK 平台与构建工具
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: 编译 APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 创建 Release 并上传 APK（gh CLI）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag_name }}"
          if [ -z "$TAG" ]; then echo "No tag_name"; exit 1; fi
          APK="app/build/outputs/apk/release/app-release.apk"

          # 删除可能存在的旧 release（忽略 404）
          gh release delete "$TAG" --repo "${{ github.repository }}" --yes 2>/dev/null || true

          # 创建 release（不指定 target，默认指向 tag 指向的 commit）
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "AI Translate $TAG" \
            --notes "自动构建"

          # 上传 asset
          gh release upload "$TAG" "$APK" --repo "${{ github.repository }}"

          # 验证
          gh release view "$TAG" --repo "${{ github.repository }}"
