name: Release APK

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "要发布的 tag（如 v1.3.22）"
        required: true
        default: "v1.3.22"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK 工具
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: 安装 SDK 平台与构建工具
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: 编译 APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 创建 Release 并上传 APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${{ github.repository }}"
          TAG="${{ inputs.tag_name }}"
          if [ -z "$TAG" ]; then
            echo "No tag_name provided"
            exit 1
          fi
          APK="app/build/outputs/apk/release/app-release.apk"
          FILENAME="AI-Translate-${TAG}.apk"

          echo "=== Creating release for $TAG ==="
          REL_ID=$(curl -s -H "Authorization: token $GH_TOKEN" -X POST \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"AI Translate $TAG\",\"body\":\"自动构建\"}" \
            "$API/releases" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('id', d.get('message','ERROR')))")
          echo "release_id=$REL_ID"

          echo "=== Uploading asset $FILENAME ==="
          UPLOAD_RESP=$(curl -s -H "Authorization: token $GH_TOKEN" -X POST \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$APK" \
            "$API/releases/$REL_ID/assets?name=$FILENAME")
          echo "$UPLOAD_RESP"
          echo "$UPLOAD_RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); print('asset:', d.get('name'), d.get('state'), d.get('size'))"
